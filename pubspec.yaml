name: muslims_app
description: A privacy-conscious Muslims companion starter app for Android and iOS.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  adhan: ^2.0.0
  geolocator: ^13.0.2
  provider: ^6.1.2
  import 'package:flutter/material.dart';
import 'package:provider/provider.dart';

import 'features/prayer_times/presentation/controllers/prayer_controller.dart';
import 'features/prayer_times/presentation/widgets/countdown_widget.dart';

void main() {
  WidgetsFlutterBinding.ensureInitialized();

  runApp(const MuslimsApp());
}

class MuslimsApp extends StatelessWidget {
  const MuslimsApp({super.key});

  @override
  Widget build(BuildContext context) {
    return ChangeNotifierProvider(
      create: (_) => PrayerController(),
      child: MaterialApp(
        title: 'Muslims',
        debugShowCheckedModeBanner: false,
        theme: ThemeData(
          useMaterial3: true,
          colorScheme: ColorScheme.fromSeed(
            seedColor: const Color(0xFF087F5B),
          ),
          scaffoldBackgroundColor: const Color(0xFFF6F8F5),
          fontFamily: 'Roboto',
        ),
        home: const PrayerHomePage(),
      ),
    );
  }
}

class PrayerHomePage extends StatelessWidget {
  const PrayerHomePage({super.key});

  @override
  Widget build(BuildContext context) {
    return Consumer<PrayerController>(
      builder: (context, controller, child) {
        final prayerTimes = controller.prayerTimes;

        if (prayerTimes == null) {
          return const Scaffold(
            body: Center(
              child: CircularProgressIndicator(),
            ),
          );
        }

        final nextPrayer = controller.nextPrayer;

        return Directionality(
          textDirection: TextDirection.rtl,
          child: Scaffold(
            appBar: AppBar(
              title: const Text('Muslims'),
              centerTitle: true,
            ),
            body: SafeArea(
              child: ListView(
                padding: const EdgeInsets.all(18),
                children: [
                  Container(
                    padding: const EdgeInsets.all(22),
                    decoration: BoxDecoration(
                      gradient: const LinearGradient(
                        colors: [
                          Color(0xFF075E46),
                          Color(0xFF10966C),
                        ],
                      ),
                      borderRadius: BorderRadius.circular(26),
                    ),
                    child: Column(
                      crossAxisAlignment:
                          CrossAxisAlignment.start,
                      children: [
                        Text(
                          controller.city,
                          style: const TextStyle(
                            color: Colors.white,
                            fontSize: 24,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                        const SizedBox(height: 20),
                        const Text(
                          'الصلاة القادمة',
                          style: TextStyle(color: Colors.white70),
                        ),
                        const SizedBox(height: 8),
                        Text(
                          nextPrayer.name,
                          style: const TextStyle(
                            color: Colors.white,
                            fontSize: 30,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                        const SizedBox(height: 16),
                        const Text(
                          'الوقت المتبقي',
                          style: TextStyle(color: Colors.white70),
                        ),
                        const SizedBox(height: 8),
                        CountdownWidget(
                          controller: controller,
                        ),
                      ],
                    ),
                  ),
                  const SizedBox(height: 20),
                  const Text(
                    'مواقيت الصلاة',
                    style: TextStyle(
                      fontSize: 21,
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                  const SizedBox(height: 12),
                  ...[
                    Prayer.fajr,
                    Prayer.sunrise,
                    Prayer.dhuhr,
                    Prayer.asr,
                    Prayer.maghrib,
                    Prayer.isha,
                  ].map((prayer) {
                    final time =
                        prayerTimes.timeForPrayer(prayer);

                    if (time == null) {
                      return const SizedBox.shrink();
                    }

                    return Card(
                      child: ListTile(
                        title: Text(prayer.name),
                        trailing: Text(
                          '${time.hour.toString().padLeft(2, '0')}:'
                          '${time.minute.toString().padLeft(2, '0')}',
                          textDirection: TextDirection.ltr,
                        ),
                      ),
                    );
                  }),
                  const SizedBox(height: 16),
                  OutlinedButton.icon(
                    onPressed: controller.isLoadingLocation
                        ? null
                        : controller.updateLocation,
                    icon: controller.isLoadingLocation
                        ? const SizedBox(
                            width: 18,
                            height: 18,
                            child: CircularProgressIndicator(
                              strokeWidth: 2,
                            ),
                          )
                        : const Icon(Icons.my_location),
                    label: Text(
                      controller.isLoadingLocation
                          ? 'جارٍ تحديد الموقع...'
                          : 'استخدام موقعي الحالي',
                    ),
                  ),
                  if (controller.message != null)
                    Padding(
                      padding: const EdgeInsets.all(10),
                      child: Text(controller.message!),
                    ),
                ],
              ),
            ),
          ),
        );
      },
    );
  }
}

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
