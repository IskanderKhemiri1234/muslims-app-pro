
name: muslims_app
description: A global Muslim companion app built with Flutter.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Core application
  quran_madina_flutter: ^2.2.2
  cupertino_icons: ^1.0.8
  adhan: ^2.0.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  timezone: ^0.11.2
  timezone_finder: ^1.0.1

  # Location and Qibla compass
  geolocator: ^13.0.2
  flutter_compass: ^0.8.1
  geomag: ^0.3.0

  # Offline world atlas - Natural Earth
  dv_map: ^1.1.0
  dv_geo_core: ^1.1.0
  vector_math: ^2.4.4

  # Existing map utilities
  flutter_map: ^8.3.2
  latlong2: ^0.9.1

  # Networking
  http: ^1.5.0

  # Mumin Pro - Adhan and notification infrastructure
  flutter_local_notifications: ^22.3.3
  just_audio: ^0.10.6
  audio_service: ^0.18.19

  # Adhan audio file selection
  file_picker: ^13.3.2

  # Mosque image selection and local storage
  image_picker: ^1.2.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/quran_madina/assets/db/v2/
    - assets/quran_madina/assets/db/v2/Madina-1441H/
    - assets/quran_madina/assets/img/
    - assets/quran_madina/dist/

    # Qibla Atlas data
    - assets/qibla/data/landmarks.json

    # Temporarily disabled because this directory does not exist.
    # Restore it after adding the image files to this directory:
    # - assets/qibla/images/wonders/
