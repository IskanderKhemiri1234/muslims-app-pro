
name: Generate Madina Quran Assets

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-quran-assets
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and verify Quran assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Display tool versions
        run: |
          flutter --version
          dart --version

      - name: Install project dependencies
        run: flutter pub get

      - name: Generate Madina Quran bundle
        run: dart run quran_madina_flutter:bundle

      - name: Verify generated Quran directories
        shell: bash
        run: |
          set -euo pipefail

          required_dirs=(
            "assets/quran_madina/assets/db/v2"
            "assets/quran_madina/assets/db/v2/Madina-1441H"
            "assets/quran_madina/assets/img"
            "assets/quran_madina/dist"
          )

          for directory in "${required_dirs[@]}"; do
            if [ ! -d "$directory" ]; then
              echo "::error::Missing directory: $directory"
              exit 1
            fi

            if ! find "$directory" -type f -print -quit | grep -q .; then
              echo "::error::No files found in: $directory"
              exit 1
            fi

            echo "Verified: $directory"
          done

          echo "All required Quran asset directories contain files."

      - name: Commit generated Quran assets
        shell: bash
        run: |
          set -euo pipefail

          git add assets/quran_madina/

          if git diff --cached --quiet; then
            echo "No new Quran asset changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Generate offline Madina Quran assets"
          git push origin HEAD:main
