
name: Muslims Pro - Android CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Muslims Pro Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Validate project structure
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f android/app/build.gradle
          test -f android/settings.gradle
          test -f android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Madina Quran assets
        run: dart run quran_madina_flutter:bundle

      - name: Verify Quran assets
        run: |
          test -d assets/quran_madina/assets/db/v2
          test -d assets/quran_madina/assets/img
          test -d assets/quran_madina/dist

      - name: Diagnose Android XML resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path("android/app/src/main")
          failed = []

          for path in sorted(root.rglob("*.xml")):
              raw = path.read_bytes()

              print(f"\n--- FILE: {path} ---")
              print("FIRST 200 BYTES:", repr(raw[:200]))

              try:
                  content = raw.decode("utf-8-sig")

                  declarations = [
                      index
                      for index in range(len(content))
                      if content.startswith("<?xml", index)
                  ]

                  print("XML DECLARATION POSITIONS:", declarations)

                  if len(declarations) > 1:
                      raise ValueError(
                          "Multiple XML declarations found."
                      )

                  if declarations and declarations[0] != 0:
                      raise ValueError(
                          "XML declaration is not at the beginning "
                          "of the file."
                      )

                  ET.fromstring(content)
                  print("XML STATUS: VALID")

              except Exception as error:
                  print("XML STATUS: INVALID")
                  print("ERROR:", error)
                  failed.append(path)

          if failed:
              print("\nINVALID XML FILES:")
              for path in failed:
                  print(path)

              raise SystemExit(
                  f"XML validation failed: {len(failed)} file(s)."
              )

          print("\nAll Android XML files passed validation.")
          PY

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muslims-Pro-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
