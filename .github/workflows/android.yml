name: Muslims Pro - Android CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "scripts/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Muslims Pro Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Validate project structure
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f android/app/build.gradle
          test -f android/settings.gradle
          test -f android/app/src/main/AndroidManifest.xml

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/mumin-pro-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Install image processing dependency
        run: python3 -m pip install --disable-pip-version-check Pillow

      - name: Prepare and verify transparent brand artwork
        run: python3 scripts/prepare_transparent_brand_assets.py

      - name: Prepare official Hafs v20 Quran font
        run: python3 scripts/prepare_quran_font.py

      - name: Prepare and verify complete offline Quran translations
        run: python3 scripts/prepare_quran_trilingual_data.py

      - name: Install dependencies
        run: flutter pub get


      - name: Diagnose Android XML resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path("android/app/src/main")
          failed = []

          for path in sorted(root.rglob("*.xml")):
              raw = path.read_bytes()

              print(f"\n--- FILE: {path} ---")
              print("FIRST 200 BYTES:", repr(raw[:200]))

              try:
                  content = raw.decode("utf-8-sig")

                  declarations = [
                      index
                      for index in range(len(content))
                      if content.startswith("<?xml", index)
                  ]

                  print("XML DECLARATION POSITIONS:", declarations)

                  if len(declarations) > 1:
                      raise ValueError(
                          "Multiple XML declarations found."
                      )

                  if declarations and declarations[0] != 0:
                      raise ValueError(
                          "XML declaration is not at the beginning "
                          "of the file."
                      )

                  ET.fromstring(content)
                  print("XML STATUS: VALID")

              except Exception as error:
                  print("XML STATUS: INVALID")
                  print("ERROR:", error)
                  failed.append(path)

          if failed:
              print("\nINVALID XML FILES:")
              for path in failed:
                  print(path)

              raise SystemExit(
                  f"XML validation failed: {len(failed)} file(s)."
              )

          print("\nAll Android XML files passed validation.")
          PY

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Calculate unique Android release version
        id: release_version
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(sed -n 's/^version: //p' pubspec.yaml | cut -d+ -f1)"
          if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid base version in pubspec.yaml: $BASE_VERSION"
            exit 1
          fi
          BUILD_NUMBER="$((1000 + GITHUB_RUN_NUMBER))"
          BUILD_NAME="${BASE_VERSION}.${BUILD_NUMBER}"
          echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Release version: $BUILD_NAME (versionCode $BUILD_NUMBER)"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_NAME: ${{ steps.release_version.outputs.build_name }}
          BUILD_NUMBER: ${{ steps.release_version.outputs.build_number }}
        run: |
          set -euo pipefail
          flutter build apk --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER"

      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK_PATH"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android apksigner tool was not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"


      - name: Publish uniquely versioned APK release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NAME: ${{ steps.release_version.outputs.build_name }}
          BUILD_NUMBER: ${{ steps.release_version.outputs.build_number }}
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          TAG="v${BUILD_NAME}"
          test -s "$APK_PATH"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release tag $TAG already exists. Refusing to overwrite a published version."
            exit 1
          fi

          gh release create "$TAG" "$APK_PATH" \
            --target "$GITHUB_SHA" \
            --title "Mumin Pro $BUILD_NAME" \
            --notes "Mumin Pro Android release.

          Version: $BUILD_NAME
          Android versionCode: $BUILD_NUMBER
          Commit: $GITHUB_SHA

          Install this APK over the existing Mumin Pro app. Do not uninstall the previous version." \
            --latest

      - name: Remove temporary release keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/mumin-pro-release.jks"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muslims-Pro-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
