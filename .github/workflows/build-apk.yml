
name: Build Muslims Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Inspect project
        run: |
          echo "Project files:"
          ls -la
          echo "Android files:"
          find android -maxdepth 4 -type f -print || true
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Generate missing Android platform files
        run: |
          if [ ! -f android/gradlew ] || \
             [ ! -f android/build.gradle ] && \
             [ ! -f android/build.gradle.kts ] || \
             [ ! -f android/gradle/wrapper/gradle-wrapper.properties ] || \
             [ ! -f android/app/src/main/kotlin/com/example/muslims_app/MainActivity.kt ] && \
             [ ! -f android/app/src/main/java/com/example/muslims_app/MainActivity.java ]; then
            flutter create --platforms=android --project-name muslims_app --org com.example /tmp/muslims_scaffold
            cp -a /tmp/muslims_scaffold/android/. android/
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Muslims-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
