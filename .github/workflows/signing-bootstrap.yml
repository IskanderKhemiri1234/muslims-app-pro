name: Mumin Pro - Secure Signing Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mumin-pro-signing-bootstrap
  cancel-in-progress: false

jobs:
  create-signing-key:
    name: Create temporary Android release signing file
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Create a unique Android release keystore and plain-text secrets file
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          KEYSTORE_PATH="$RUNNER_TEMP/mumin-pro-release.jks"
          SECRETS_PATH="$RUNNER_TEMP/Mumin-Pro-Signing-Secrets.txt"

          STORE_PASSWORD="$(openssl rand -hex 32)"
          KEY_PASSWORD="$(openssl rand -hex 32)"
          KEY_ALIAS="muminprorelease"

          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE_PATH" \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 3072 \
            -validity 10000 \
            -dname "CN=Mumin Pro, OU=Mobile, O=Mumin Pro"

          KEYSTORE_BASE64="$(base64 -w 0 "$KEYSTORE_PATH")"

          {
            printf '%s\n' "ANDROID_KEYSTORE_BASE64=$KEYSTORE_BASE64"
            printf '%s\n' "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            printf '%s\n' "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            printf '%s\n' "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } > "$SECRETS_PATH"

          test -s "$SECRETS_PATH"
          TAG="mumin-pro-signing-bootstrap-$GITHUB_RUN_ID"

          gh release create "$TAG" "$SECRETS_PATH#Mumin-Pro-Signing-Secrets.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Temporary Mumin Pro signing secrets" \
            --notes "PRIVATE TEMPORARY SIGNING MATERIAL. Download only for adding the four Android signing values to repository Actions secrets. Delete this release immediately after saving them. Do not share this file." \
            --prerelease \
            --target "$GITHUB_SHA"

          echo "Temporary plain-text signing file published as a private release asset."
          echo "Do not print or share its contents."

      - name: Remove temporary plaintext key material from runner
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/mumin-pro-release.jks"
          rm -f "$RUNNER_TEMP/Mumin-Pro-Signing-Secrets.txt"
