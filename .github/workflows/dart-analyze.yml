
name: Mumin Pro - Dart Analysis

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/dart-analyze.yml"

permissions:
  contents: read

concurrency:
  group: dart-analyze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Dart Code
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze
