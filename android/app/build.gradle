plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

// Generate the transparent RGBA logo and shortcut illustrations from the
// original uploaded artwork before Flutter bundles assets or Android compiles.
def prepareMuminBrandAssets = tasks.register('prepareMuminBrandAssets', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', 'scripts/prepare_transparent_brand_assets.py'
    inputs.files(
        rootProject.file('../assets/branding/mumin_pro_logo.png'),
        rootProject.file('../scripts/prepare_transparent_brand_assets.py'),
        fileTree(rootProject.file('../assets/images/home/reference_ui')) {
            include 'icon_qibla.png', 'icon_quran.png', 'icon_kaaba.png',
                    'icon_azkar.png', 'icon_tasbih.png'
        }
    )
    outputs.files(
        rootProject.file('../assets/branding/processed/mumin_pro_logo.png'),
        rootProject.file('../assets/images/home/reference_ui/processed/icon_qibla.png'),
        rootProject.file('../assets/images/home/reference_ui/processed/icon_quran.png'),
        rootProject.file('../assets/images/home/reference_ui/processed/icon_kaaba.png'),
        rootProject.file('../assets/images/home/reference_ui/processed/icon_azkar.png'),
        rootProject.file('../assets/images/home/reference_ui/processed/icon_tasbih.png')
    )
}

def syncMuminBrandAsset = tasks.register('syncMuminBrandAsset', Copy) {
    dependsOn(prepareMuminBrandAssets)
    def brandSource = rootProject.file('../assets/branding/processed/mumin_pro_logo.png')
    from(brandSource) {
        rename { 'mumin_pro_brand.png' }
    }
    into("$projectDir/src/main/res/drawable-nodpi")
}

tasks.matching { it.name.startsWith('compileFlutterBuild') }.configureEach {
    dependsOn(prepareMuminBrandAssets)
}

tasks.named('preBuild').configure {
    dependsOn(syncMuminBrandAsset)
}

android {
    namespace 'com.iskander.muslimspro'

    buildFeatures {
        buildConfig true
    }

    compileSdk flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId 'com.iskander.muslimspro'

        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion

        // Flutter's --build-number and --build-name values are injected
        // by the Flutter Gradle plugin for each CI release.
        versionCode flutter.versionCode
        versionName flutter.versionName

        multiDexEnabled true
    }

    def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
    def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
    def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
    def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
    def releaseSigningConfigured = [
        releaseKeystorePath,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword
    ].every { value -> value != null && !value.trim().isEmpty() }

    if (releaseSigningConfigured) {
        def releaseKeystoreFile = file(releaseKeystorePath)
        if (!releaseKeystoreFile.isFile()) {
            throw new GradleException(
                "Release keystore file does not exist: ${releaseKeystorePath}"
            )
        }

        signingConfigs {
            release {
                storeFile releaseKeystoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
        }
    }

    // Debug builds must remain buildable without production signing secrets.
    // Release packaging must never silently produce an unsigned deliverable.
    tasks.configureEach { task ->
        if (task.name in ['assembleRelease', 'bundleRelease', 'packageRelease']) {
            task.doFirst {
                if (!releaseSigningConfigured) {
                    throw new GradleException(
                        'Release signing is not configured. Provide ANDROID_KEYSTORE_PATH, ' +
                        'ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD.'
                    )
                }
            }
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

flutter {
    source '../..'
}
