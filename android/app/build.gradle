plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace 'com.iskander.muslimspro'

    buildFeatures {
        buildConfig true
    }

    compileSdk flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId 'com.iskander.muslimspro'

        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion

        // Flutter's --build-number and --build-name values are injected
        // by the Flutter Gradle plugin for each CI release.
        versionCode flutter.versionCode
        versionName flutter.versionName

        multiDexEnabled true
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
            def storePasswordValue = System.getenv('ANDROID_KEYSTORE_PASSWORD')
            def keyAliasValue = System.getenv('ANDROID_KEY_ALIAS')
            def keyPasswordValue = System.getenv('ANDROID_KEY_PASSWORD')

            if (!keystorePath || !storePasswordValue || !keyAliasValue || !keyPasswordValue) {
                throw new GradleException(
                    'Release signing is not configured. Provide ANDROID_KEYSTORE_PATH, ' +
                    'ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD.'
                )
            }

            def keystoreFile = file(keystorePath)
            if (!keystoreFile.isFile()) {
                throw new GradleException(
                    "Release keystore file does not exist: ${keystorePath}"
                )
            }

            storeFile keystoreFile
            storePassword storePasswordValue
            keyAlias keyAliasValue
            keyPassword keyPasswordValue
        }
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

flutter {
    source '../..'
}
