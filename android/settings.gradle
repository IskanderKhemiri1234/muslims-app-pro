
pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = file("local.properties")

        if (!localPropertiesFile.exists()) {
            throw new GradleException(
                "Flutter SDK path is missing. Create android/local.properties " +
                "and set flutter.sdk to your Flutter SDK directory."
            )
        }

        localPropertiesFile.withInputStream {
            properties.load(it)
        }

        def sdkPath = properties.getProperty("flutter.sdk")

        if (sdkPath == null || sdkPath.trim().isEmpty()) {
            throw new GradleException(
                "flutter.sdk is not configured in android/local.properties."
            )
        }

        return sdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"

    id "com.android.application" version "8.11.1" apply false

    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

include ":app"
